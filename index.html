<!doctype html>
<html lang="ru"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>EVERGUARD · Мониторинг датчиков</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#edf2ec;color:#162d23;font:16px system-ui,sans-serif}main{max-width:960px;margin:auto;padding:clamp(24px,7vw,80px) 24px}h1{font-size:clamp(32px,6vw,64px);line-height:1.05;margin:0 0 20px;letter-spacing:-.045em}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,270px),1fr));gap:14px;margin:26px 0}article,details{background:#fff;border:1px solid #d3ded4;border-radius:16px;padding:22px}h2{font-size:16px;margin:0;font-weight:600}output{display:block;font-size:44px;font-weight:700;margin:10px 0 2px;font-variant-numeric:tabular-nums}small,p{color:#496456}summary{cursor:pointer;font-weight:650}label{display:block;margin:14px 0}input{display:block;width:100%;padding:10px;margin-top:6px;border:1px solid #687d70;border-radius:6px;font:inherit}button{padding:10px 15px;background:#173b2a;color:white;border:0;border-radius:7px;font:inherit;cursor:pointer}
</style>
<main>
<h1>EVERGUARD</h1>
<p id="status" role="status">Загружаем показания…</p>
<div class="grid">
<article><h2>Температура</h2><output id="temperature">—</output><small>DHT22 · °C</small></article>
<article><h2>Влажность</h2><output id="humidity">—</output><small>DHT22 · %</small></article>
<article><h2>Дым и газ</h2><output id="mq2">—</output><small>MQ‑2 · значение АЦП</small></article>
<article><h2>Показание MQ‑135</h2><output id="mq135">—</output><small>Значение АЦП</small></article>
</div>

</main><script type="module" src="./dashboard.js"></script></html>
