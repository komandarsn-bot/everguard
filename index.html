<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#101916">
<title>EVERGUARD — мониторинг датчиков</title>
<link rel="stylesheet" href="./dashboard.css">
<script type="module" src="./dashboard.js"></script>
</head>
<body>
<header class="bar"><div class="wrap bar-inner"><span class="brand"><span class="mark" aria-hidden="true"></span>EVERGUARD</span><span class="bar-label">Станция наблюдения</span></div></header>
<main class="wrap">
  <section class="heading" aria-labelledby="title">
    <h1 id="title">Мониторинг<br>датчиков</h1>
    <div class="status-panel" id="status-panel" data-state="loading">
      <span class="status-dot" aria-hidden="true"></span>
      <div><span class="status-label" id="status-label">Подключение</span><p id="status" role="status">Загружаем показания…</p></div>
    </div>
  </section>
  <section class="grid" aria-label="Последние показания">
    <article class="metric"><div class="metric-top"><h2>Температура</h2><span class="chip">DHT22</span></div><div class="reading"><output id="temperature">—</output><span class="unit">°C</span></div></article>
    <article class="metric"><div class="metric-top"><h2>Влажность</h2><span class="chip">DHT22</span></div><div class="reading"><output id="humidity">—</output><span class="unit">%</span></div></article>
    <article class="metric"><div class="metric-top"><h2>Дым и газ</h2><span class="chip">MQ‑2</span></div><div class="reading"><output id="mq2">—</output><span class="unit">АЦП</span></div></article>
    <article class="metric"><div class="metric-top"><h2>Показание MQ‑135</h2><span class="chip">MQ‑135</span></div><div class="reading"><output id="mq135">—</output><span class="unit">АЦП</span></div></article>
  </section>
</main>
</body>
</html>
